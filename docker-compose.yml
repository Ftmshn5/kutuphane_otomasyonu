services:
  db:
    image: postgres:16
    container_name: kutuphane-db
    environment:
      POSTGRES_USER: kutuphane
      POSTGRES_PASSWORD: kutuphane
      POSTGRES_DB: kutuphane_db
    ports:
      - "5432:5432"
    volumes:
      - kutuphane_veri:/var/lib/postgresql/data

volumes:
  kutuphane_veri:
